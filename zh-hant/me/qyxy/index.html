<!DOCTYPE html>
<html lang="zh-Hant" data-locale="zh-hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青雲學研帳戶 | Login Example</title>
    <link href="/css/me/style.css" rel="stylesheet">
    <script src="/js/i18n.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="logo">
            <h1 data-i18n="home">Login Example</h1>
            <nav class="locale-switcher"><a data-locale-link="zh-cn" href="/zh-cn/">简中</a><a data-locale-link="zh-hant" href="/zh-hant/">繁中</a><a data-locale-link="en-us" href="/en-us/">EN</a></nav>
        </div>
    </div>

    <div class="profile-container">
        <div class="avatar">
            <img src="" alt="Loading…" data-i18n-aria-label="loading" id="avatar">
        </div>

        <div class="user-info">
            <h1 class="username" id="nickname">Loading…</h1>
            <p class="login" id="username"></p>
            <p class="bio" id="email"></p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="UserGroup"></div>
                <div class="stat-label" data-i18n="userGroup">使用者群組</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="Level"></div>
                <div class="stat-label" data-i18n="level">等級</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="UserId"></div>
                <div class="stat-label" data-i18n="userId">使用者 ID</div>
            </div>
        </div>

        <button class="logout-btn" id="logout_btn" data-i18n="logout">登出</button>
    </div>

    <div class="footer">
        <p>© 2025 Login - Example </p>
    </div>
</body>
<script src="/me/qyxy/script/script.js" defer></script>
</html>
